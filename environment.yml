name: rl-26-08
channels:
  - defaults
dependencies:
  - python=3.13
  - tk>=8.6
  - matplotlib
  - numpy
  - pillow
  - requests
  - gymnasium
  - pip
  - pip:
      - pygame>=2.5
      - stable-baselines3==2.9.0
      # torch wird von stable-baselines3 mitgebracht, aber auch direkt
      # importiert (Thread-Zahl, Policy-Kopien) - deshalb ausdruecklich.
      - torch>=2.3
      # swig muss vor box2d stehen: das Box2D-Paket benoetigt es zum Bauen.
      # Box2D wird ab 10-lunarlander fuer die Gymnasium-Box2D-Environments gebraucht.
      - swig
      - box2d
      # mujoco und imageio bilden das Gymnasium-Extra "gymnasium[mujoco]" und
      # werden ab 13-hopper fuer die MuJoCo-Environments gebraucht. imageio
      # importiert gymnasium.envs.mujoco.mujoco_rendering; ohne es scheitert
      # bereits das Erzeugen von Hopper-v5.
      - mujoco>=3.2
      - imageio>=2.14.1
      # pycma ist die Referenzimplementierung von CMA-ES und wird ab
      # 15-walker2d gebraucht. Stable-Baselines3 kennt das Verfahren nicht.
      - cma>=4.0
